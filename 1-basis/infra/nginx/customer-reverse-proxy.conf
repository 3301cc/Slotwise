# =============================================================================
# STW-301 · Variante B: Inline-Einbindung über den Webserver des Kunden.
# Der Kunde leitet /termine/ auf Slotwise weiter; das Widget wird von der
# Kundendomain ausgeliefert, es entsteht kein Request an fremde Hosts.
# Dieser Block gehört in die nginx-Konfiguration des Kunden.
# =============================================================================
location /termine/ {
    proxy_pass              https://embed.slotwise.de/;
    proxy_ssl_server_name   on;
    proxy_set_header        Host embed.slotwise.de;
    proxy_set_header        X-Embed-Tenant "nordlicht";        # vom Slotwise-Backend zugeteilt
    proxy_set_header        X-Forwarded-Proto https;
    proxy_set_header        X-Forwarded-For "";                # keine Client-IP weitergeben
    proxy_set_header        Cookie "";                         # keine Kunden-Cookies an Slotwise
    proxy_hide_header       Set-Cookie;
    proxy_ignore_headers    Set-Cookie;
    proxy_read_timeout      15s;

    # Pfad-Rewrite für Assets und API, die das Widget relativ lädt
    sub_filter_once off;
    sub_filter_types text/html application/javascript;
    sub_filter '"/assets/' '"/termine/assets/';
    sub_filter '"/api/'    '"/termine/api/';
}
