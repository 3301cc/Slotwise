# =============================================================================
# STW-301 · Cookie-freies Embed
# Ein Server-Block pro Kundendomain (termine.kunde.de -> CNAME auf embed.slotwise.de).
# Zertifikate per ACME (certbot --nginx oder acme.sh), TLS 1.2+ only.
#
# Grundsätze:
#  - Kein Set-Cookie verlässt diesen Host (proxy_hide_header + proxy_ignore_headers).
#  - Keine externen Ressourcen: CSP default-src 'self', keine Ausnahmen.
#  - frame-ancestors wird pro Kundendomain aus einer Map gesetzt, damit das
#    Widget nur auf den freigegebenen Websites eingebettet werden kann.
#  - Referrer-Policy no-referrer: die Kundenseite erfährt nichts über Buchungs-URLs.
#  - Access-Logs ohne IP (anonymisiert) und mit 7 Tagen Rotation.
# =============================================================================

# Erlaubte einbettende Domains je Embed-Host (Kunde pflegt das im Slotwise-Backend,
# der Renderer schreibt diese Map). Standard: nur der eigene Host.
map $host $embed_frame_ancestors {
    default                  "'self'";
    termine.nordlicht.de     "'self' https://www.nordlicht.de https://nordlicht.de";
    termine.kaufmann-ag.de   "'self' https://www.kaufmann-ag.de";
}

# IP-Anonymisierung im Log (IPv4 letztes Oktett, IPv6 letzte 80 Bit)
map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
    ~(?P<ip>[^:]+:[^:]+):       $ip::;
    default                     0.0.0.0;
}
log_format anon '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

# Rate-Limiting pro Client-IP: nur im Arbeitsspeicher der Zone, nie auf Platte,
# nie im Log (Log ist anonymisiert). 30 Requests/Minute, Burst 20.
limit_req_zone $binary_remote_addr zone=embed_rl:10m rate=30r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name termine.nordlicht.de termine.kaufmann-ag.de;

    ssl_certificate     /etc/letsencrypt/live/embed.slotwise.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embed.slotwise.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/embed.access.log anon;
    error_log  /var/log/nginx/embed.error.log warn;

    # --- Sicherheitsheader (auf jeder Antwort, auch Fehlern) ---------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors $embed_frame_ancestors; form-action 'self'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-store" always;
    # X-Frame-Options bewusst NICHT setzen: frame-ancestors in der CSP ist die maßgebliche, feinere Regel.

    # --- Kein Cookie in beide Richtungen ------------------------------------
    proxy_hide_header   Set-Cookie;
    proxy_ignore_headers Set-Cookie;
    proxy_set_header    Cookie "";

    # --- Upstream -------------------------------------------------------------
    location / {
        proxy_pass         http://slotwise-embed-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
        # Keine Client-IP an die App: Rate-Limiting passiert hier in nginx, die App sieht keine Adresse.
        proxy_set_header   X-Forwarded-For "";
        limit_req          zone=embed_rl burst=20 nodelay;
        limit_req_status   429;
        proxy_read_timeout 15s;
    }

    # Schriften und Assets liegen im selben Origin (self-hosted, siehe embed/fonts.css)
    location /assets/ {
        proxy_pass http://slotwise-embed-app:3000/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # Health ohne Logging
    location = /healthz { access_log off; return 200 "ok"; }
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name termine.nordlicht.de termine.kaufmann-ag.de;
    return 301 https://$host$request_uri;
}
